<style>
  /* ================================================================
     色彩變數
     這裡的變數「名稱」與 booking.html 保持一致，方便對照，但數值不同：
     本頁支援可切換的 7 色主題（見下方 JS 的 THEMES 陣列 + applyTheme()），
     這裡列出的只是預設值，實際顯示的顏色會被 applyTheme() 動態覆寫。
     booking.html 固定使用「岩石灰」配色（等同 THEMES 陣列最後一組）。
     ================================================================ */
  :root{
    --bg:#1D2D44;
    --card-bg:#243A5A;
    --card-border:rgba(141,160,183,0.20);
    --white:#E6E9EE;
    --gray:#8DA0B7;
    --gray-dim:rgba(141,160,183,0.42);
    --gold:#D4BA8A;
    --gold-bg:rgba(212,186,138,0.10);
    --gold-border:rgba(212,186,138,0.45);
    --blue:#AEBFD1;
    --blue-bg:rgba(141,160,183,0.10);
    --blue-border:rgba(141,160,183,0.55);
    --green:#8FBFA0;
    --red:#C97B6E;
    --tag-text:#1D2D44;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    background:var(--bg);color:var(--white);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior:none;
  }
  .wrap{
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
  }

  .topbar{
    flex:0 0 auto;
    display:flex;flex-direction:column;gap:5px;
    padding:clamp(10px,2.4vh,18px) clamp(14px,3.5vw,22px) clamp(6px,1.4vh,10px);
  }
  .topbar .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .topbar .title{
    font-weight:700;font-size:clamp(13px,2.5vh,17px);letter-spacing:0.01em;color:var(--white);line-height:1.3;
  }
  .topbar .subtitle{font-size:clamp(9.5px,1.7vh,11.5px);color:var(--gray);font-weight:500;}
  .topbar .right{
    display:flex;align-items:center;gap:7px;font-size:clamp(8.5px,1.6vh,11px);color:var(--gray);
    cursor:pointer;padding:4px 8px;margin:-4px -8px;border-radius:8px;flex-shrink:0;
    transition:background 0.15s ease, opacity 0.15s ease;
    -webkit-user-select:none;user-select:none;
  }
  .topbar .right:active{background:rgba(255,255,255,0.06);opacity:0.7;}
  .topbar .right .time{color:var(--white);font-weight:600;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gray-dim);flex-shrink:0;}
  .dot.live{background:var(--green);box-shadow:0 0 6px rgba(62,217,138,0.7);}
  .dot.err{background:var(--red);}

  /* ================================================================
     日期卡片／時段格／圖例
     以下這組樣式（.days-list ~ .legend）與 booking.html 對應段落
     幾乎逐字相同，只有少數顏色細節因主題機制而不同。
     若要調整版面外觀（間距、圓角、字級等），請同步修改 booking.html，
     以維持兩頁視覺一致。
     ================================================================ */
  .days-list{
    flex:1 1 auto;
    display:flex;flex-direction:column;
    gap:clamp(6px,1.3vh,12px);
    min-height:0;
    padding:0 clamp(14px,3.5vw,22px) clamp(8px,1.6vh,14px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .day-card{
    flex:0 0 auto;min-height:64px;
    display:flex;align-items:center;gap:clamp(8px,2vw,18px);
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:clamp(10px,1.6vh,16px);
    padding:clamp(10px,1.8vh,14px) clamp(10px,2.2vw,18px);
    position:relative;
    overflow:hidden;
  }
  .day-card.today{
    background:linear-gradient(180deg, var(--gold-bg), var(--card-bg) 70%);
    border-color:rgba(240,185,74,0.25);
  }
  .day-card.today::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold);
  }

  .date-block{
    flex:0 0 auto;
    width:clamp(60px,15vw,92px);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;
  }
  .date-block .date-text{
    font-weight:700;font-size:clamp(12px,2.7vh,17px);color:var(--white);letter-spacing:0.01em;white-space:nowrap;
  }
  .day-card.today .date-block .date-text{color:var(--gold);}
  .date-block .weekday-row{
    display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:3px;
  }
  .date-block .weekday-text{font-size:clamp(9px,1.75vh,11px);color:var(--gray);font-weight:400;white-space:nowrap;}
  .date-block .today-tag{
    font-size:clamp(7.5px,1.4vh,9px);color:var(--tag-text);background:var(--gold);
    padding:1px 5px;border-radius:999px;font-weight:700;white-space:nowrap;
  }

  .slots-line{
    flex:1 1 auto;min-width:0;
    display:flex;gap:clamp(4px,1.1vw,10px);
  }
  .slot{
    flex:1 1 0;min-width:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:clamp(6px,1vh,9px);
    font-size:clamp(9px,1.85vh,11.5px);
    line-height:1.15;
    border:1.3px solid var(--blue-border);
    background:var(--blue-bg);
    color:var(--blue);
    font-weight:700;
    padding:clamp(4px,1vh,8px) 2px;
  }
  .slot .t{white-space:nowrap;}
  .slot .tag{
    font-size:clamp(6.5px,1.15vh,8px);
    font-weight:400;letter-spacing:0.01em;
    margin-top:2px;color:var(--gray-dim);
  }
  /* min-height derived from the two-line "不可預約" content (padding*2 +
     .t line + .tag margin-top + .tag line), same clamp() expressions as
     those rules, so every slot matches that height at any viewport size
     without a JS-measured height. Kept in sync with booking.html. */
  .slot{
    min-height: calc(
      clamp(4px,1vh,8px) * 2 +
      clamp(9px,1.85vh,11.5px) * 1.15 +
      2px +
      clamp(6.5px,1.15vh,8px) * 1.15 +
      2px
    );
  }
  .slot:not(.blocked) .t{
    font-size:clamp(12px,2.6vh,15px);
    font-weight:500;
  }
  .slot.blocked{
    background:rgba(255,255,255,0.02);
    border:1.4px solid rgba(255,255,255,0.09);
    color:var(--gray-dim);
    font-weight:400;
  }
  .slot.blocked .t{text-decoration:line-through;text-decoration-color:rgba(255,255,255,0.18);}

  .slot.clickable{cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform 0.12s ease, opacity 0.12s ease;}
  .slot.clickable:active{transform:scale(0.94);opacity:0.75;}
  .slot.passed{cursor:default;}

  /* ================================================================
     確認彈窗（本頁專屬：鎖定／解除時段用）
     注意：booking.html 也有 class 名稱同為 .modal-overlay/.modal-box 的
     彈窗，但用途不同（人數超過限制提示、時段不相鄰確認），內容結構也不同，
     兩邊並非共用同一組樣式，請勿假設改一邊會影響另一邊。
     ================================================================ */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    z-index:100;
    opacity:0;pointer-events:none;
    transition:opacity 0.15s ease;
  }
  .modal-overlay.show{opacity:1;pointer-events:auto;}
  .modal-box{
    width:100%;max-width:320px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:22px 20px 16px;
    text-align:center;
    transform:translateY(8px);
    transition:transform 0.15s ease;
  }
  .modal-overlay.show .modal-box{transform:translateY(0);}
  .modal-title{font-size:15px;font-weight:700;color:var(--white);margin-bottom:8px;}
  .modal-detail{font-size:13px;color:var(--gray);margin-bottom:18px;line-height:1.5;}
  .modal-error{font-size:12px;color:var(--red);margin:-10px 0 14px;min-height:14px;}
  .modal-buttons{display:flex;gap:10px;}
  .modal-btn{
    flex:1 1 0;
    padding:11px 8px;
    border-radius:10px;
    font-size:14px;font-weight:600;
    border:1px solid var(--card-border);
    background:transparent;color:var(--gray);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .modal-btn.confirm{
    background:var(--gold);border-color:var(--gold-border);color:var(--tag-text);
  }
  .modal-btn:disabled{opacity:0.5;}
  .modal-btn.confirm.unlock{background:var(--red);border-color:var(--red);color:#fff;}

  .legend{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;gap:clamp(14px,3.5vw,26px);
    padding:clamp(6px,1.4vh,10px) 10px;
    border-top:1px solid var(--card-border);
    font-size:clamp(8.5px,1.6vh,10.5px);color:var(--gray);
  }
  .legend .item{display:flex;align-items:center;gap:5px;}
  .legend .sq{width:10px;height:10px;border-radius:3px;border:1.3px solid var(--blue-border);background:var(--blue-bg);}
  .legend .sq.off{border-color:rgba(255,255,255,0.16);background:rgba(255,255,255,0.02);}
  .legend .dot-legend{width:9px;height:9px;border-radius:50%;background:var(--gold);}

  @media (max-width:340px){
    .topbar{padding:8px 10px 6px;}
    .days-list{padding:0 10px 8px;gap:5px;}
    .day-card{padding:0 8px;gap:6px;}
    .date-block{width:56px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="row1">
      <span class="title">回春視務所 證件照 預約時段</span>
      <div class="right" id="statusTrigger" title="點一下重新整理並換色">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">讀取中</span>
        <span class="time" id="statusTime"></span>
      </div>
    </div>
    <span class="subtitle">未來15天・點時段可鎖定/解除</span>
  </div>

  <div class="days-list" id="daysList"></div>

  <div class="legend">
    <span class="item"><span class="sq"></span>可預約</span>
    <span class="item"><span class="sq off"></span>不可預約</span>
    <span class="item"><span class="dot-legend"></span>今天</span>
  </div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">確定要鎖定這個時段嗎？</div>
    <div class="modal-detail" id="modalDetail"></div>
    <div class="modal-error" id="modalError"></div>
    <div class="modal-buttons">
      <button class="modal-btn" id="modalCancel">取消</button>
      <button class="modal-btn confirm" id="modalConfirm">確定</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ================================================================
  // 設定區
  // SHEET_ID / SHEET_NAME / SLOT_TIMES / DAYS_TO_SHOW 這幾項必須跟
  // booking.html 裡的對應設定完全一致（同一份試算表、同樣的時段定義），
  // 也必須跟寫入用的 Worker 裡的 SHEET_ID / SHEET_NAME / SLOT_TIMES 一致。
  // 若要換試算表、加時段、改天數，記得三個地方都要同步修改。
  // ================================================================
  var SHEET_ID = "1-0UwxcPNxA95FFRCNICMbhheGtC5-Z9wwBGUQRaLZP0";
  var SHEET_NAME = "booking";
  var gvizUrl = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json" +
                (SHEET_NAME ? "&sheet=" + encodeURIComponent(SHEET_NAME) : "");

  // 每次更新這個檔案，把版本號改成新的（例如當天日期），
  // 已開啟的頁面/PWA會在背景偵測到版本不同，自動強制重新載入最新版本
  // 注意：此版本偵測機制（BUILD_VERSION + checkForUpdate，見檔案最下方）
  // 目前只用在本頁（管理端），booking.html 客人端沒有啟用這個機制。
  var BUILD_VERSION = "2026-08-09-01";

  var SLOT_TIMES = ["10:00", "11:00", "13:30", "14:30", "15:30"];
  var DAYS_TO_SHOW = 15; // 含今天共 15 天

  // 寫入用的 Cloudflare Worker 網址（取代舊的 Apps Script /exec 網址）
  var WEBAPP_URL = "https://crimson-dream-d3cf.drum3126.workers.dev";

  var bookedMap = {}; // { "YYYY-MM-DD": { "10:00": true, ... } }
  var pending = null; // { dateKey, time, action, label }
  var isSubmitting = false;

  // 管理密碼：不寫死在檔案裡（此 repo 為 public），第一次寫入操作時
  // 才彈窗詢問，存進 localStorage；之後每次寫入都帶著送出，
  // 若 Worker 回 403（密碼錯誤）就清掉重新詢問。
  var PW_KEY = "hc_admin_pw";
  function ensurePassword(){
    var pw = localStorage.getItem(PW_KEY);
    if(pw) return pw;
    pw = window.prompt("請輸入管理密碼：");
    if(!pw) return "";
    localStorage.setItem(PW_KEY, pw);
    return pw;
  }

  var daysList = document.getElementById('daysList');
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var statusTime = document.getElementById('statusTime');
  var statusTrigger = document.getElementById('statusTrigger');
  var modalOverlay = document.getElementById('modalOverlay');
  var modalTitle = document.getElementById('modalTitle');
  var modalDetail = document.getElementById('modalDetail');
  var modalError = document.getElementById('modalError');
  var modalCancel = document.getElementById('modalCancel');
  var modalConfirm = document.getElementById('modalConfirm');

  // ================================================================
  // 七色莫蘭迪主題（深底淺字，維持一致風格）
  // 本頁專屬功能，booking.html 沒有主題切換，固定使用「岩石灰」配色
  // （對應下面陣列最後一組「岩石灰」）。
  // ================================================================
  var THEMES = [
    { name:"深藍", vars:{
      bg:"#1D2D44", "card-bg":"#243A5A", "card-border":"rgba(141,160,183,0.20)",
      white:"#E6E9EE", gray:"#8DA0B7", "gray-dim":"rgba(141,160,183,0.42)",
      gold:"#D4BA8A", "gold-bg":"rgba(212,186,138,0.10)", "gold-border":"rgba(212,186,138,0.45)",
      blue:"#AEBFD1", "blue-bg":"rgba(141,160,183,0.10)", "blue-border":"rgba(141,160,183,0.55)",
      green:"#8FBFA0", red:"#C97B6E", "tag-text":"#1D2D44"
    }},
    { name:"桃紅", vars:{
      bg:"#3A2B2C", "card-bg":"#4A3638", "card-border":"rgba(199,151,140,0.22)",
      white:"#F0E2DE", gray:"#C79E93", "gray-dim":"rgba(199,151,140,0.40)",
      gold:"#E0A467", "gold-bg":"rgba(224,164,103,0.12)", "gold-border":"rgba(224,164,103,0.45)",
      blue:"#DDB2A3", "blue-bg":"rgba(221,178,163,0.12)", "blue-border":"rgba(221,178,163,0.55)",
      green:"#93BE99", red:"#D2867A", "tag-text":"#3A2B2C"
    }},
    { name:"深綠", vars:{
      bg:"#212E28", "card-bg":"#2B3B33", "card-border":"rgba(150,178,160,0.20)",
      white:"#E4EBE5", gray:"#9AB6A4", "gray-dim":"rgba(150,178,160,0.42)",
      gold:"#CDB981", "gold-bg":"rgba(205,185,129,0.10)", "gold-border":"rgba(205,185,129,0.45)",
      blue:"#A9C4B0", "blue-bg":"rgba(150,178,160,0.10)", "blue-border":"rgba(150,178,160,0.55)",
      green:"#8FBF9E", red:"#D48A7D", "tag-text":"#212E28"
    }},
    { name:"咖啡", vars:{
      bg:"#2E2620", "card-bg":"#3B3128", "card-border":"rgba(184,158,130,0.22)",
      white:"#EDE3D6", gray:"#B79E85", "gray-dim":"rgba(184,158,130,0.40)",
      gold:"#D0A25C", "gold-bg":"rgba(208,162,92,0.12)", "gold-border":"rgba(208,162,92,0.45)",
      blue:"#C9AD8D", "blue-bg":"rgba(201,173,141,0.12)", "blue-border":"rgba(201,173,141,0.55)",
      green:"#9BB98A", red:"#C97F6A", "tag-text":"#2E2620"
    }},
    { name:"米白", vars:{
      bg:"#F0EBE1", "card-bg":"#F8F6F0", "card-border":"rgba(120,110,95,0.18)",
      white:"#3A3630", gray:"#8B8375", "gray-dim":"rgba(139,131,117,0.45)",
      gold:"#A9865C", "gold-bg":"rgba(169,134,92,0.14)", "gold-border":"rgba(169,134,92,0.45)",
      blue:"#7C8D86", "blue-bg":"rgba(124,141,134,0.14)", "blue-border":"rgba(124,141,134,0.50)",
      green:"#6E8F72", red:"#B5695A", "tag-text":"#2E2A24"
    }},
    { name:"粉紅", vars:{
      bg:"#332830", "card-bg":"#413441", "card-border":"rgba(196,150,175,0.22)",
      white:"#F0E1EA", gray:"#C79AB4", "gray-dim":"rgba(196,150,175,0.40)",
      gold:"#D9A48F", "gold-bg":"rgba(217,164,143,0.12)", "gold-border":"rgba(217,164,143,0.45)",
      blue:"#D8AFC4", "blue-bg":"rgba(216,175,196,0.12)", "blue-border":"rgba(216,175,196,0.55)",
      green:"#96BFA3", red:"#CB7E8C", "tag-text":"#332830"
    }},
    { name:"岩石灰", vars:{
      bg:"#2A2B2C", "card-bg":"#363839", "card-border":"rgba(170,172,175,0.22)",
      white:"#E7E8E9", gray:"#A8ACAF", "gray-dim":"rgba(170,172,175,0.42)",
      gold:"#C7B98E", "gold-bg":"rgba(199,185,142,0.10)", "gold-border":"rgba(199,185,142,0.45)",
      blue:"#B7BEC4", "blue-bg":"rgba(170,172,175,0.10)", "blue-border":"rgba(170,172,175,0.55)",
      green:"#93B79E", red:"#C4837A", "tag-text":"#2A2B2C"
    }}
  ];

  function applyTheme(idx){
    var t = THEMES[(idx % THEMES.length + THEMES.length) % THEMES.length];
    var root = document.documentElement.style;
    Object.keys(t.vars).forEach(function(k){
      root.setProperty('--' + k, t.vars[k]);
    });
  }

  function daysSinceEpoch(d){
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  var currentThemeIndex = daysSinceEpoch(new Date()) % THEMES.length;
  if(currentThemeIndex < 0) currentThemeIndex += THEMES.length;
  applyTheme(currentThemeIndex);

  // ================================================================
  // 共用工具函式（日期／時間／GViz 解析）
  // 這一整塊（weekdayNames ~ cellHasValue）與 booking.html 逐字相同。
  // 若要修改這些函式的行為，請同步修改兩個檔案，保持內容一致，
  // 避免兩頁對「今天」「時段是否過期」「試算表格式」的判斷產生落差。
  // ================================================================
  var weekdayNames = ["日","一","二","三","四","五","六"];

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function dateKey(y,m,d){ return y + "-" + pad(m+1) + "-" + pad(d); }
  function todayKey(){
    var t = new Date();
    return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function timeToMinutes(t){
    var p = t.split(':');
    return parseInt(p[0],10) * 60 + parseInt(p[1],10);
  }
  function nowMinutes(){
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
  function isSlotTimePassed(timeStr){
    return nowMinutes() > timeToMinutes(timeStr);
  }
  function nowHHMM(){
    var d = new Date();
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  // ---- 解析 GViz 特殊格式 ----
  function parseGvizCellRaw(cell){
    if(!cell) return null;
    var v = cell.v;
    if(typeof v === "string"){
      var m = v.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
      if(m){
        return { kind:"date", y:parseInt(m[1],10), mo:parseInt(m[2],10), d:parseInt(m[3],10) };
      }
    }
    return { kind:"raw", value: v };
  }
  function extractDateString(cell){
    var parsed = parseGvizCellRaw(cell);
    if(!parsed) return null;
    if(parsed.kind === "date") return dateKey(parsed.y, parsed.mo, parsed.d);
    if(parsed.value == null) return null;
    var s = String(parsed.value).trim();
    var m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if(m) return m[1] + "-" + pad(parseInt(m[2],10)) + "-" + pad(parseInt(m[3],10));
    return null;
  }
  function cellHasValue(cell){
    if(!cell) return false;
    var v = cell.v;
    return v !== null && v !== undefined && v !== "";
  }
  // ==================== 共用工具函式結束 ====================

  // ================================================================
  // 資料讀取：抓取並解析 GViz 回應，建立 bookedMap
  // 解析試算表回傳格式的核心邏輯與 booking.html 相同。
  // 差異：booking.html 多了 isLoading 防重入、強制 no-store 不快取、
  // 以及重新整理圖示旋轉動畫；本頁沒有這些，是既有的設計差異，非遺漏。
  // ================================================================
  function loadAvailability(){
    statusText.textContent = "讀取中";
    statusTime.textContent = "";
    statusDot.className = "dot";
    fetch(gvizUrl)
      .then(function(res){
        if(!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function(text){
        var match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
        if(!match) throw new Error("格式解析失敗");
        var json = JSON.parse(match[1]);
        if(!json.table || !json.table.rows) throw new Error("試算表格式不符");

        var rows = json.table.rows;
        var map = {};
        rows.forEach(function(row){
          var cells = row.c;
          if(!cells || !cells[0]) return;
          var dKey = extractDateString(cells[0]);
          if(!dKey) return;
          var dayBooked = map[dKey] || {};
          SLOT_TIMES.forEach(function(time, idx){
            var cell = cells[idx + 1];
            if(cellHasValue(cell)) dayBooked[time] = true;
          });
          map[dKey] = dayBooked;
        });
        bookedMap = map;
        statusDot.className = "dot live";
        statusText.textContent = "已同步";
        statusTime.textContent = nowHHMM();
        render();
      })
      .catch(function(err){
        statusDot.className = "dot err";
        statusText.textContent = "讀取失敗";
        statusTime.textContent = nowHHMM();
        render();
      });
  }

  function formatDateLine(y, m, d){
    return pad(m+1) + "/" + pad(d);
  }

  // ================================================================
  // 畫面渲染：組出 15 天 × 5 時段的卡片列表
  // ================================================================
  function render(){
    daysList.innerHTML = "";
    var base = new Date();
    var tKey = todayKey();

    for(var i=0; i<DAYS_TO_SHOW; i++){
      var d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
      var key = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
      var isToday = key === tKey;
      var booked = bookedMap[key] || {};

      var card = document.createElement('div');
      card.className = "day-card" + (isToday ? " today" : "");

      var dateBlock = document.createElement('div');
      dateBlock.className = "date-block";
      dateBlock.innerHTML =
        '<span class="date-text">' + formatDateLine(d.getFullYear(), d.getMonth(), d.getDate()) + '</span>' +
        '<span class="weekday-row"><span class="weekday-text">星期' + weekdayNames[d.getDay()] + '</span>' +
        (isToday ? '<span class="today-tag">今天</span>' : '') + '</span>';
      card.appendChild(dateBlock);

      var slotsLine = document.createElement('div');
      slotsLine.className = "slots-line";

      SLOT_TIMES.forEach(function(time){
        var timePassed = isToday && isSlotTimePassed(time);
        var isBooked = !!booked[time];
        var blocked = timePassed || isBooked;
        // 已過期且尚未鎖定的時段：不能操作（過去的時段不能預約）
        // 已鎖定的時段：無論是否過期，都能點擊解除（避免按錯無法復原）
        var clickable = isBooked || !timePassed;

        var slot = document.createElement('div');
        slot.className = "slot" + (blocked ? " blocked" : "") + (clickable ? " clickable" : " passed");
        slot.dataset.date = key;
        slot.dataset.time = time;
        slot.dataset.action = isBooked ? "unlock" : "lock";
        var html = '<span class="t">' + time + '</span>';
        if(blocked){
          html += '<span class="tag">不可預約</span>';
        }
        slot.innerHTML = html;
        slotsLine.appendChild(slot);
      });

      card.appendChild(slotsLine);
      daysList.appendChild(card);
    }
  }

  // ================================================================
  // 鎖定／解除確認彈窗（本頁專屬流程）
  // ================================================================
  function formatDetailLine(dateKey, time){
    var p = dateKey.split('-');
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    return p[0] + "/" + p[1] + "/" + p[2] + "（" + weekdayNames[d.getDay()] + "）" + time;
  }

  function openModal(dateKey, time, action){
    pending = { dateKey: dateKey, time: time, action: action };
    modalError.textContent = "";
    modalDetail.textContent = formatDetailLine(dateKey, time);
    if(action === "lock"){
      modalTitle.textContent = "確定要鎖定這個時段嗎？";
      modalConfirm.textContent = "確定鎖定";
      modalConfirm.classList.remove("unlock");
    } else {
      modalTitle.textContent = "確定要解除這個時段的鎖定嗎？";
      modalConfirm.textContent = "確定解除";
      modalConfirm.classList.add("unlock");
    }
    modalConfirm.disabled = false;
    modalCancel.disabled = false;
    modalOverlay.classList.add("show");
  }

  function closeModal(){
    modalOverlay.classList.remove("show");
    pending = null;
    isSubmitting = false;
  }

  // 時段點擊（事件委派，效能較好）
  daysList.addEventListener('click', function(e){
    var slot = e.target.closest ? e.target.closest('.slot.clickable') : null;
    if(!slot) return;
    openModal(slot.dataset.date, slot.dataset.time, slot.dataset.action);
  });

  modalCancel.addEventListener('click', function(){
    if(isSubmitting) return;
    closeModal();
  });

  modalOverlay.addEventListener('click', function(e){
    if(e.target === modalOverlay && !isSubmitting) closeModal();
  });

  modalConfirm.addEventListener('click', function(){
    if(!pending) return;

    if(!WEBAPP_URL || WEBAPP_URL.indexOf("http") !== 0){
      modalError.textContent = "尚未設定 Worker 網址，無法寫入試算表";
      return;
    }

    var password = ensurePassword();
    if(!password) return; // 使用者取消輸入密碼，不進行操作

    var current = pending;
    var dateKey = current.dateKey, time = current.time, action = current.action;

    // 真正的樂觀更新：立刻關閉彈窗、更新格子顏色，寫入請求在背景送出，
    // 失敗才跳提示並把格子顏色還原。
    var dayBooked = bookedMap[dateKey] || {};
    var hadValue = !!dayBooked[time];
    if(action === "lock"){
      dayBooked[time] = true;
    } else {
      delete dayBooked[time];
    }
    bookedMap[dateKey] = dayBooked;
    render();
    closeModal();

    function revert(){
      var d = bookedMap[dateKey] || {};
      if(hadValue){
        d[time] = true;
      } else {
        delete d[time];
      }
      bookedMap[dateKey] = d;
      render();
    }

    var controller = new AbortController();
    var timeoutId = setTimeout(function(){ controller.abort(); }, 10000);

    fetch(WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // 避免CORS預檢請求
      body: JSON.stringify({ date: dateKey, time: time, action: action, password: password }),
      signal: controller.signal
    })
      .then(function(res){
        if(res.status === 403){
          localStorage.removeItem(PW_KEY);
          throw new Error("密碼錯誤，請重新輸入");
        }
        return res.json();
      })
      .then(function(data){
        if(!data || !data.ok){
          throw new Error((data && data.message) || "寫入失敗");
        }
      })
      .catch(function(err){
        revert();
        var msg = (err && err.name === "AbortError") ? "連線逾時，請重試" : ("操作失敗：" + ((err && err.message) || err));
        alert(msg);
      })
      .finally(function(){
        clearTimeout(timeoutId);
      });
  });

  // 點擊右上角狀態區塊：換下一個顏色 + 立即重新整理資料
  statusTrigger.addEventListener('click', function(){
    currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
    applyTheme(currentThemeIndex);
    loadAvailability();
  });

  // 初始渲染 + 讀取資料
  render();
  loadAvailability();

  // 每 30 秒重新檢查「今天」是否有時段過期；每 60 秒重新抓一次試算表資料
  setInterval(render, 30000);
  setInterval(loadAvailability, 60000);

  // ---- 自動版本偵測：避免瀏覽器/主畫面PWA卡住舊版內容 ----
  // 原理：定期用不快取的方式重新抓自己的原始碼，比對裡面的版本號，
  // 發現不一樣就強制導向一個帶新版本號的網址，逼瀏覽器重新載入最新內容
  var isCheckingUpdate = false;
  function checkForUpdate(){
    if(isCheckingUpdate) return;
    isCheckingUpdate = true;
    fetch(location.pathname + '?_vc=' + Date.now(), { cache: 'no-store' })
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function(html){
        var m = html.match(/BUILD_VERSION\s*=\s*"([^"]+)"/);
        if(m && m[1] && m[1] !== BUILD_VERSION){
          location.href = location.pathname + '?v=' + encodeURIComponent(m[1]) + '&_r=' + Date.now();
        }
      })
      .catch(function(){ /* 離線或抓取失敗就先沿用目前版本，不打擾使用 */ })
      .finally(function(){ isCheckingUpdate = false; });
  }
  checkForUpdate();
  setInterval(checkForUpdate, 5 * 60 * 1000); // 每 5 分鐘背景檢查一次
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') checkForUpdate();
  });
  window.addEventListener('pageshow', function(e){
    if(e.persisted) checkForUpdate();
  });

})();
</script>
</body>
</html>
