  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* ══════════════════════════
       單一純色主題變數
    ══════════════════════════ */
    [data-theme="navy"] {
      --bg-color: #2c3e52;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-bg-hover: rgba(255, 255, 255, 0.11);
      --card-border: rgba(255, 255, 255, 0.13);
      --card-border-hover: rgba(255, 255, 255, 0.22);
      --text-primary: #eef1f5;
      --text-secondary: #9eb3c4;
      --text-muted: rgba(180, 200, 215, 0.5);
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.15);
      --input-focus: rgba(255, 255, 255, 0.28);
      --divider: rgba(255, 255, 255, 0.1);
      --accent: #5b8fa8;
    }
    [data-theme="forest"] {
      --bg-color: #2e4a3a;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-bg-hover: rgba(255, 255, 255, 0.11);
      --card-border: rgba(255, 255, 255, 0.13);
      --card-border-hover: rgba(255, 255, 255, 0.22);
      --text-primary: #edf3ef;
      --text-secondary: #9ec4ae;
      --text-muted: rgba(160, 210, 180, 0.5);
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.15);
      --input-focus: rgba(255, 255, 255, 0.28);
      --divider: rgba(255, 255, 255, 0.1);
      --accent: #5a9e78;
    }
    [data-theme="plum"] {
      --bg-color: #3e3050;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-bg-hover: rgba(255, 255, 255, 0.11);
      --card-border: rgba(255, 255, 255, 0.13);
      --card-border-hover: rgba(255, 255, 255, 0.22);
      --text-primary: #f0ecf5;
      --text-secondary: #b8a8cc;
      --text-muted: rgba(190, 170, 215, 0.5);
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.15);
      --input-focus: rgba(255, 255, 255, 0.28);
      --divider: rgba(255, 255, 255, 0.1);
      --accent: #8870aa;
    }
    [data-theme="mocha"] {
      --bg-color: #4a3728;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-bg-hover: rgba(255, 255, 255, 0.11);
      --card-border: rgba(255, 255, 255, 0.13);
      --card-border-hover: rgba(255, 255, 255, 0.22);
      --text-primary: #f5f0eb;
      --text-secondary: #c4aa90;
      --text-muted: rgba(210, 185, 160, 0.5);
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.15);
      --input-focus: rgba(255, 255, 255, 0.28);
      --divider: rgba(255, 255, 255, 0.1);
      --accent: #9a7a5a;
    }
    [data-theme="burgundy"] {
      --bg-color: #4a2430;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-bg-hover: rgba(255, 255, 255, 0.11);
      --card-border: rgba(255, 255, 255, 0.13);
      --card-border-hover: rgba(255, 255, 255, 0.22);
      --text-primary: #f5eeef;
      --text-secondary: #c49aa4;
      --text-muted: rgba(210, 170, 180, 0.5);
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.15);
      --input-focus: rgba(255, 255, 255, 0.28);
      --divider: rgba(255, 255, 255, 0.1);
      --accent: #9a5060;
    }

    /* ══════════════════════════
       滿版純色背景（無漸層，全頁一致）
    ══════════════════════════ */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color, #2c3e52) !important;
      font-family: 'Noto Sans TC', sans-serif;
      overscroll-behavior: none;
      transition: background-color 0.3s ease;
    }

    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-color, #2c3e52);
    }

    /* ══════════════════════════
       頂部 Banner（與背景色一致，僅保留分隔線）
    ══════════════════════════ */
    #today-banner {
      flex-shrink: 0;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--divider);
      padding-top: env(safe-area-inset-top, 0px);
    }
    .banner-inner {
      padding: 10px 16px 12px;
    }
    .banner-row1 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .banner-row2 {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    #date-text {
      font-size: 1.1rem;

    /* ══════════════════════════

    /* ══════════════════════════

    ══════════════════════════ */
    .task-card {

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

    }
    .task-card:active { transform: scale(0.985); }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-expired {
      background: rgba(160, 45, 58, 0.38) !important;
      border-color: rgba(200, 70, 85, 0.45) !important;
      animation: cardIn 0.28s cubic-bezier(0.34,1.4,0.64,1), pulseRed 2.5s 0.3s infinite;
    }
    .card-urgent {
      background: rgba(150, 100, 28, 0.38) !important;
      border-color: rgba(190, 140, 50, 0.42) !important;

    @keyframes pulseRed {
      0%,100% { box-shadow: 0 0 0 0 rgba(200,70,85,0); }

    .card-body {
      display: flex;

      padding: 13px 14px;

    .task-check {
      width: 24px; height: 24px;

    .task-check:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.45); }
    .task-check.checked { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.5); }

    .task-content { flex: 1; min-width: 0; }
    .task-name {
      font-size: 0.93rem;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta {
      display: flex;

    }
    .repeat-chip {

    .card-right {

      flex-direction: column;

      flex-shrink: 0;
    }
    .badge {
      font-size: 0.67rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;

    }
    .badge-expired  { background: rgba(200,65,80,0.75);  color: #fff; }
    .badge-today    { background: rgba(200,65,80,0.75);  color: #fff; }
    .badge-urgent   { background: rgba(185,130,45,0.75); color: #fff; }
    .badge-safe     { background: rgba(255,255,255,0.12); color: var(--text-secondary); }
    .badge-done     { background: rgba(255,255,255,0.08); color: var(--text-muted); }

    .btn-delete {

    .card-removing {

      text-align: center;

      padding: 64px 24px;

    /* ══════════════════════════

    ══════════════════════════ */

    .modal-btn-confirm:hover { background: rgba(255,255,255,0.26); }
  </style>
</head>
<body>

<div id="app-container">
  <!-- ══════════════════════════════════

  <!-- ══════════════════════════════════

  ══════════════════════════════ -->

      <input id="input-date" class="ifield" type="date" style="flex:1; min-width:0;" />
      <select id="input-repeat" class="repeat-select">
        <option value="none">不重複</option>
        <option value="day">每隔 N 天</option>

          min="1" max="999" value="1" style="width:52px; text-align:center;" />

     MODAL（重複任務完成確認）
══════════════════════════════ -->

      <button class="modal-btn modal-btn-cancel"  id="modal-cancel">取消</button>

<script>
/* ╔═══════════════════════════════════════╗
   ║           D U E Y  v2.5               ║
   ╚═══════════════════════════════════════╝ */

const APP_VERSION = '2026.07.29-1';
const STORAGE_KEY = 'duey_tasks_v2';
const THEME_KEY   = 'duey_theme_v1';
const WEEKDAYS    = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

/* ── 週期單位標籤 ── */
const UNIT_LABELS = { day:'天', week:'週', month:'月', year:'年' };

/* ════════════════════════════════
   日期工具
════════════════════════════════ */
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

function diffDays(dateStr) {
  const t = new Date(todayStr());
  const d = new Date(dateStr);
  return Math.round((d - t) / 86400000);
}

function fmtDate(str) {
  const [y,m,d] = str.split('-');
  return `${y}/${parseInt(m)}/${parseInt(d)}`;
}

/** 根據週期計算下一個日期字串 */
function nextDate(dateStr, repeatType, repeatNum) {
  const d = new Date(dateStr);
  const n = parseInt(repeatNum) || 1;
  switch (repeatType) {
    case 'day':   d.setDate(d.getDate() + n);       break;
    case 'week':  d.setDate(d.getDate() + n * 7);   break;
    case 'month': d.setMonth(d.getMonth() + n);      break;
    case 'year':  d.setFullYear(d.getFullYear() + n);break;
  }
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ════════════════════════════════
   localStorage
════════════════════════════════ */
let tasks = [];
function loadTasks() {
  try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { tasks = []; }
}
function saveTasks() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

/* ════════════════════════════════
   主題與底色防護
════════════════════════════════ */
const THEME_COLORS = {
  navy:'#2c3e52', forest:'#2e4a3a', plum:'#3e3050', mocha:'#4a3728', burgundy:'#4a2430'
};

function applyTheme(t) {
  const theme = THEME_COLORS[t] ? t : 'navy';
  const color = THEME_COLORS[theme];
  
  document.documentElement.setAttribute('data-theme', theme);
  document.body.setAttribute('data-theme', theme);
  
  /* 同步修改根節點背景色，確保全頁無縫一體 */
  document.documentElement.style.backgroundColor = color;
  document.body.style.backgroundColor = color;
  
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.t === theme));
  
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', color);
  
  localStorage.setItem(THEME_KEY, theme);
}

/* ════════════════════════════════
   Banner
════════════════════════════════ */
function renderBanner() {
  const now = new Date();
  document.getElementById('date-text').textContent =
    `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日`;
  document.getElementById('weekday-text').textContent = WEEKDAYS[now.getDay()];
  const pending = tasks.filter(t => !t.done).length;
  document.getElementById('task-count').textContent = pending ? `${pending} 件待辦` : '';
}

/* ════════════════════════════════
   卡片狀態
════════════════════════════════ */
function cardState(task) {
  if (task.done) return 'done';
  const d = diffDays(task.date);
  if (d < 0)  return 'expired';
  if (d === 0) return 'today';
  if (d <= 3) return 'urgent';
  return 'safe';
}

function badgeInfo(task) {
  if (task.done) return { cls:'badge-done', text:'已完成' };
  const d = diffDays(task.date);
  if (d < 0)  return { cls:'badge-expired', text:`過期 ${Math.abs(d)} 天` };
  if (d === 0) return { cls:'badge-today',   text:'🔥 今天' };
  if (d <= 3) return { cls:'badge-urgent',  text:`剩 ${d} 天` };
  return { cls:'badge-safe', text:`剩 ${d} 天` };
}

function cardBgCls(state) {
  return { expired:'card-expired', today:'card-expired', urgent:'card-urgent', done:'card-done', safe:'' }[state] || '';
}

/* ════════════════════════════════
   週期標籤文字
════════════════════════════════ */
function repeatLabel(task) {
  if (!task.repeatType || task.repeatType === 'none') return '';
  const n = task.repeatNum || 1;
  return `每 ${n} ${UNIT_LABELS[task.repeatType]}`;
}

/* ════════════════════════════════
   HTML 跳脫
════════════════════════════════ */
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ════════════════════════════════
   渲染清單
════════════════════════════════ */
const GROUP_ORDER  = ['expired','today','urgent','safe','done'];
const GROUP_LABELS = {
  expired: '⚠️ 已過期',
  today:   '🔥 今天到期',
  urgent:  '⏰ 緊迫（1–3 天）',
  safe:    '✓ 安全',
  done:    '✔ 已完成'
};

function renderList() {
  const listEl = document.getElementById('task-list');
  const hintEl = document.getElementById('empty-hint');

  if (tasks.length === 0) {
    listEl.innerHTML = '';
    hintEl.style.display = 'block';
    renderBanner();
    return;
  }
  hintEl.style.display = 'none';

  /* 排序：依分組順序，組內依 diff 升冪 */
  const sorted = [...tasks].sort((a, b) => {
    const ga = GROUP_ORDER.indexOf(cardState(a));
    const gb = GROUP_ORDER.indexOf(cardState(b));
    if (ga !== gb) return ga - gb;
    return diffDays(a.date) - diffDays(b.date);
  });

  let html = '';
  let lastGroup = null;

  sorted.forEach(task => {
    const state = cardState(task);
    const badge = badgeInfo(task);
    const bgCls = cardBgCls(state);
    const rl    = repeatLabel(task);
    const isDone = task.done;

    if (state !== lastGroup) {
      html += `<div class="section-label">${GROUP_LABELS[state]}</div>`;
      lastGroup = state;
    }

    html += `
    <div class="task-card ${bgCls}" id="card-${task.id}" data-id="${esc(task.id)}">
      <div class="card-body">
        <!-- Checkbox -->
        <button class="task-check ${isDone?'checked':''}"
          onclick="handleCheck('${esc(task.id)}')" aria-label="完成">
          ${isDone
            ? `<svg width="11" height="11" viewBox="0 0 11 11" fill="none">
                <path d="M1.5 5.5l3 3 5-5" stroke="rgba(255,255,255,0.9)"
                  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
               </svg>`
            : ''}
        </button>

        <!-- 文字 -->
        <div class="task-content">
          <div class="task-name ${isDone?'done-text':''}">${esc(task.name)}</div>
          <div class="task-meta">
            <span class="task-date-label">${fmtDate(task.date)}</span>
            ${rl ? `<span class="repeat-chip">↺ ${esc(rl)}</span>` : ''}
          </div>
        </div>

        <!-- 右側 -->
        <div class="card-right">
          <span class="badge ${badge.cls}">${badge.text}</span>
          <button class="btn-delete" onclick="removeTask('${esc(task.id)}')" aria-label="刪除">✕</button>
        </div>
      </div>
    </div>`;
  });

  listEl.innerHTML = html;
  renderBanner();
}

/* ════════════════════════════════
   操作：打勾
════════════════════════════════ */
function handleCheck(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  if (task.done) {
    /* 已完成 → 取消完成 */
    task.done = false;
    saveTasks(); renderList();
    showToast('已取消完成');
    return;
  }

  /* 未完成 → 即將完成 */
  if (task.repeatType && task.repeatType !== 'none') {
    /* 有週期 → 跳 Modal 確認 */
    const nd = nextDate(task.date, task.repeatType, task.repeatNum);
    showModal(
      `完成並建立下一筆`,
      `「${task.name}」完成後，系統將自動新增下一筆：\n目標日期 <span class="modal-next-date">${fmtDate(nd)}</span>`,
      () => {
        task.done = true;
        /* 立即新增下一筆 */
        tasks.push({
          id: uid(),
          name: task.name,
          date: nd,
          done: false,
          repeatType: task.repeatType,
          repeatNum:  task.repeatNum,
          createdAt: Date.now()
        });
        saveTasks(); renderList();
        showToast('已完成，下一筆已建立 ✓');
      }
    );
  } else {
    /* 無週期 → 直接完成 */
    task.done = true;
    saveTasks(); renderList();
    showToast('已標記完成 ✓');
  }
}

/* ════════════════════════════════
   操作：刪除
════════════════════════════════ */
function removeTask(id) {
  const card = document.getElementById('card-' + id);
  const doRemove = () => {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks(); renderList();
    showToast('已刪除');
  };
  if (card) {
    card.classList.add('card-removing');
    card.addEventListener('animationend', doRemove, { once: true });
  } else { doRemove(); }
}

/* ════════════════════════════════
   操作：新增
════════════════════════════════ */
function addTask() {
  const nameEl   = document.getElementById('input-name');
  const dateEl   = document.getElementById('input-date');
  const repeatEl = document.getElementById('input-repeat');
  const numEl    = document.getElementById('input-repeat-num');

  const name       = nameEl.value.trim();
  const date       = dateEl.value;
  const repeatType = repeatEl.value;
  const repeatNum  = parseInt(numEl.value) || 1;

  if (!name) { shake(nameEl); showToast('請輸入任務名稱'); return; }
  if (!date) { shake(dateEl); showToast('請選擇日期');     return; }

  const rType = repeatType === 'none' ? null : repeatType;
  const rNum  = repeatType === 'none' ? null : repeatNum;

  tasks.push({
    id: uid(), name, date, done: false,
    repeatType: rType, repeatNum: rNum, createdAt: Date.now()
  });

  saveTasks(); renderList();
  nameEl.value = '';
  nameEl.focus();
  showToast('已新增 ✓');
}

/* ════════════════════════════════
   匯出 / 匯入
════════════════════════════════ */
function exportTasks() {
  const dataStr = JSON.stringify(tasks, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const d    = new Date();
  a.href     = url;
  a.download = `duey-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('已匯出備份 ✓');
}

function importTasksFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let incoming;
    try {
      incoming = JSON.parse(reader.result);
      if (!Array.isArray(incoming)) throw new Error('格式錯誤');
    } catch (err) {
      showToast('匯入失敗：檔案格式不正確');
      return;
    }

    const doOverwrite = () => {
      tasks = incoming;
      saveTasks(); renderList();
      showToast(`已覆蓋，共 ${incoming.length} 筆 ✓`);
    };
    const doMerge = () => {
      incoming.forEach(t => tasks.push({ ...t, id: uid() }));
      saveTasks(); renderList();
      showToast(`已合併，新增 ${incoming.length} 筆 ✓`);
    };

    showModal(
      '匯入備份',
      `偵測到匯入檔案有 ${incoming.length} 筆任務，目前清單有 ${tasks.length} 筆。\n請選擇處理方式：`,
      doOverwrite,
      { confirmLabel: '覆蓋現有清單', extra: { label: '合併保留兩者', onClick: doMerge } }
    );
  };
  reader.readAsText(file, 'utf-8');
}

document.getElementById('btn-export').addEventListener('click', exportTasks);
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('input-import-file').click();
});
document.getElementById('input-import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) importTasksFromFile(file);
  e.target.value = '';
});

/* ════════════════════════════════
   震動動畫
════════════════════════════════ */
function shake(el) {
  el.style.transition = 'none';
  const frames = [
    {transform:'translateX(0)'},{transform:'translateX(-6px)'},
    {transform:'translateX(6px)'},{transform:'translateX(-4px)'},
    {transform:'translateX(0)'}
  ];
  el.animate(frames, { duration: 320, easing: 'ease' });
}

/* ════════════════════════════════
   Modal
════════════════════════════════ */
let _modalConfirmCb = null;
let _modalExtraCb = null;
function showModal(title, bodyHtml, onConfirm, opts) {
  opts = opts || {};
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml.replace(/\n/g,'<br>');
  document.getElementById('modal-confirm').textContent = opts.confirmLabel || '確認完成';

  const extraBtn = document.getElementById('modal-extra');
  if (opts.extra) {
    extraBtn.textContent = opts.extra.label;
    extraBtn.style.display = '';
    _modalExtraCb = opts.extra.onClick;
  } else {
    extraBtn.style.display = 'none';
    _modalExtraCb = null;
  }

  _modalConfirmCb = onConfirm;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  _modalConfirmCb = null;
  _modalExtraCb = null;
}
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.getElementById('modal-confirm').addEventListener('click', () => {
  if (_modalConfirmCb) _modalConfirmCb();
  closeModal();
});
document.getElementById('modal-extra').addEventListener('click', () => {
  if (_modalExtraCb) _modalExtraCb();
  closeModal();
});

/* ════════════════════════════════
   Toast
════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ════════════════════════════════
   週期選擇器聯動
════════════════════════════════ */
document.getElementById('input-repeat').addEventListener('change', function() {
  const wrap = document.getElementById('repeat-num-wrap');
  const unitEl = document.getElementById('repeat-unit-label');
  if (this.value === 'none') {
    wrap.style.display = 'none';
  } else {
    wrap.style.display = 'flex';
    unitEl.textContent = UNIT_LABELS[this.value] || '';
  }
});

/* ════════════════════════════════
   事件綁定
════════════════════════════════ */
document.getElementById('btn-add').addEventListener('click', addTask);
document.getElementById('input-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!document.getElementById('input-date').value) {
      document.getElementById('input-date').focus();
    } else { addTask(); }
  }
});
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => applyTheme(btn.dataset.t));
});

/* 每分鐘刷新倒數 */
setInterval(renderList, 60000);

/* ════════════════════════════════
   版本檢查
════════════════════════════════ */
async function checkForUpdate() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const url = location.href.split('#')[0].split('?')[0] + '?_=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    const m = text.match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) {
      document.getElementById('update-banner').classList.add('show');
    }
  } catch (e) { }
}
document.getElementById('update-refresh-btn').addEventListener('click', () => {
  location.reload();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkForUpdate();
});

/* ════════════════════════════════
   初始化
════════════════════════════════ */
(function init() {
  loadTasks();
  applyTheme(localStorage.getItem(THEME_KEY) || 'navy');
  document.getElementById('input-date').value = todayStr();

  /* 示範資料（首次使用） */
  if (tasks.length === 0) {
    const add = (offset, name, rType, rNum, done) => {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      tasks.push({
        id: uid(),
        name,
        date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
        done: !!done,
        repeatType: rType || null,
        repeatNum:  rNum  || null,
        createdAt: Date.now()
      });
    };
    add(-14, '健身房續約');
    add(2,   '演唱會搶票');
    add(17,  '保險費', 'year',  1);
    add(-5,  '房租',   'month', 1, true);
    saveTasks();
  }

  renderList();
  checkForUpdate();
  setInterval(checkForUpdate, 10 * 60 * 1000);
})();
</script>
