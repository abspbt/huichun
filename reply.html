  <script>
    let selectedDate = new Date();

    function initSec1() {
      setSec1Time('10:00');
    }

    function setSec1Date(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      selectedDate = d;
      
      const currentVal = document.getElementById('sec1-datetime').value;
      const timePart = currentVal ? currentVal.split('T')[1] || '10:00' : '10:00';
      
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const date = String(d.getDate()).padStart(2, '0');
      
      document.getElementById('sec1-datetime').value = `${year}-${month}-${date}T${timePart}`;
      updateSec1();
    }

    function setSec1Time(timeStr) {
      const currentVal = document.getElementById('sec1-datetime').value;
      let datePart;
      if (currentVal) {
        datePart = currentVal.split('T')[0];
      } else {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const date = String(d.getDate()).padStart(2, '0');
        datePart = `${year}-${month}-${date}`;
      }
      
      document.getElementById('sec1-datetime').value = `${datePart}T${timeStr}`;
      updateSec1();
    }

    function formatDateTime(val) {
      if(!val) return "【 時間 】";
      const d = new Date(val);
      const month = d.getMonth() + 1;
      const date = d.getDate();
      const week = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
      const hours = String(d.getHours()).padStart(2, '0');
      const mins = String(d.getMinutes()).padStart(2, '0');
      return `${month}/${date}(${week}) ${hours}:${mins}`;
    }

    function updateSec1() {
      const dt = document.getElementById('sec1-datetime').value;
      const timeStr = formatDateTime(dt);
      const text = `您好，我是證件照攝影師

地址及拍照的注意事項放：https://hui-chin.com`;
      document.getElementById('sec1-preview').innerText = text;

    }

    function updateSec3() {
      const dateVal = document.getElementById('sec3-date').value;
      let datePrefix = "";
      if (dateVal) {
        const d = new Date(dateVal);
        const month = d.getMonth() + 1;
        const date = d.getDate();
        const week = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
        datePrefix = `${month}/${date}(${week}) `;
      }

      const activePills = Array.from(document.querySelectorAll('#time-pills .pill.active')).map(p => p.innerText);
      const timeString = activePills.join(' 、 ');
      
      const text = datePrefix ? `${datePrefix}可預約時間：\n${timeString}` : timeString;
      document.getElementById('sec3-preview').innerText = text || "未選擇時段";
    }

    function copyText(elementId) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text).then(() => {
        showToast();
      });
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // 初始化設定
    document.getElementById('sec3-date').valueAsDate = new Date();
    initSec1();
    updateSec3();
  </script>
</body>
</html>
