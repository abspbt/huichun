<script>
(function(){
  "use strict";

  // 導覽項目點擊時先淡出畫面再真正跳轉（真實網址跳轉，非局部置換，維持 SEO）
  document.querySelectorAll('a.menu-item[data-transition="fade"]').forEach(function(link){
    link.addEventListener('click', function(e){
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      e.preventDefault();
      var href = link.getAttribute('href');
      document.body.classList.add('leaving');
      requestAnimationFrame(function(){
        document.body.classList.add('leaving-out');
      });
      setTimeout(function(){ location.href = href; }, 220);
    });
  });

  // 自動偵測改版，避免手機瀏覽器停留在舊版內容（做法見 CLAUDE.md
  // 「Mobile browsers showing stale cached content」）。
  // 每次更新這個檔案，把版本號改成新的（例如當天日期）。
  var BUILD_VERSION = "2026-09-03-10";
  var isCheckingUpdate = false;
  // 剛部署完的那幾分鐘，CDN 各節點還沒同步完成，這裡抓到的內容可能忽新忽舊，
  // 若每次偵測到差異就立刻重新整理，會讓頁面在測速工具（如 PageSpeed Insights）
  // 分析到一半時被硬生生導頁，導致分析卡住轉圈圈。加上冷卻時間，同一個分頁
  // 短時間內最多只強制重新整理一次，其餘留給下一輪偵測或使用者手動整理。
  var RELOAD_COOLDOWN_MS = 20000;
  function checkForUpdate(){
    if(isCheckingUpdate) return;
    isCheckingUpdate = true;
    fetch(location.pathname + '?_vc=' + Date.now(), { cache: 'no-store' })
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function(html){
        var m = html.match(/BUILD_VERSION\s*=\s*"([^"]+)"/);
        if(m && m[1] && m[1] !== BUILD_VERSION){
          var lastReload = 0;
          try{ lastReload = parseInt(sessionStorage.getItem('hc_last_reload') || '0', 10); }catch(e){}
          if(Date.now() - lastReload < RELOAD_COOLDOWN_MS) return;
          try{ sessionStorage.setItem('hc_last_reload', String(Date.now())); }catch(e){}
          location.href = location.pathname + '?v=' + encodeURIComponent(m[1]) + '&_r=' + Date.now();
        }
      })
      .catch(function(){ /* 離線或抓取失敗就先沿用目前版本，不打擾使用 */ })
      .finally(function(){ isCheckingUpdate = false; });
  }
  // 第一次檢查等畫面載完再做：這個檢查會把整份 HTML 再抓一次，
  // 若和圖片、字型搶頻寬，慢速網路下會拖慢首頁出現的速度。
  function startUpdateChecks(){ setTimeout(checkForUpdate, 1500); }
  if(document.readyState === 'complete') startUpdateChecks();
  else window.addEventListener('load', startUpdateChecks, { once: true });
  setInterval(checkForUpdate, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') checkForUpdate();
  });
  window.addEventListener('pageshow', function(e){
    // 從瀏覽器上一頁/下一頁快取（bfcache）復原時，畫面可能還停在
    // 點擊導覽按鈕當下淡出到一半的狀態（body 帶著 leaving/leaving-out
    // class、opacity:0），看起來像整頁空白，要手動重新整理才會恢復。
    // 復原當下先把這兩個 class 拿掉，讓畫面回到正常顯示。
    document.body.classList.remove('leaving', 'leaving-out');
    if(e.persisted) checkForUpdate();
  });
})();
</script>
